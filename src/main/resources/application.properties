spring.application.name=fitops
# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitops}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.jpa.hibernate.ddl-auto=validate
#Spring Monolith
spring.modulith.events.jdbc.schema-initialization.enabled=true
# virtual threads (Java 21 Project Loom)
spring.threads.virtual.enabled=true
# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# log
logging.structured.format.console=logstash
# JWT
fitops.security.jwt.secret=${JWT_SECRET}
fitops.security.jwt.issuer=${JWT_ISSUER:fitops}
fitops.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL}
# CORS
fitops.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
fitops.security.cors.max-age=${CORS_MAX_AGE}
# Cache
fitops.cache.default-ttl=${CACHE_DEFAULT_TTL:10m}
fitops.cache.default-max-size=${CACHE_DEFAULT_MAX_SIZE:500}
# Password hashing
fitops.security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
# Refresh token
fitops.security.refresh-token.ttl=${REFRESH_TOKEN_TTL:P7D}
fitops.security.refresh-token.cookie-name=${REFRESH_COOKIE_NAME:refreshToken}
fitops.security.refresh-token.cookie-path=${REFRESH_COOKIE_PATH:/api/v1/auth}
fitops.security.refresh-token.secure=${REFRESH_COOKIE_SECURE:true}
# Password reset
fitops.security.password-reset.ttl=${PASSWORD_RESET_TTL:PT1H}
fitops.security.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}
# Rate limiting
fitops.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
fitops.security.rate-limit.capacity=${RATE_LIMIT_CAPACITY:5}
fitops.security.rate-limit.refill-period=${RATE_LIMIT_REFILL_PERIOD:PT1M}