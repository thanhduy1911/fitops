spring.application.name=fitops
# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitops}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.jpa.hibernate.ddl-auto=validate
# virtual threads (Java 21 Project Loom)
spring.threads.virtual.enabled=true
# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# log
logging.structured.format.console=logstash
# JWT
fitops.security.jwt.issuer=fitops
fitops.security.jwt.secret=${JWT_SECRET}
fitops.security.jwt.access-token-ttl=PT1H
# CORS
fitops.security.cors.allowed-origins=${FITOPS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
fitops.security.cors.max-age=PT1H