name: Backend CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  init:
    name: Pipeline Initialize
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - name: Compute pipeline metadata
        id: meta
        run: |
          echo "sha_short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "branch=$(echo $GITHUB_REF_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Print pipeline info
        run: |
          echo "SHA:    ${{ steps.meta.outputs.sha_short }}"
          echo "Branch: ${{ steps.meta.outputs.branch }}"

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: init
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw clean test