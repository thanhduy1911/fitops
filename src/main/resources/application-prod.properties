# SpringDoc
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# Actuator
management.endpoints.web.exposure.include=health
# Rate limiting
fitops.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
fitops.security.rate-limit.capacity=${RATE_LIMIT_CAPACITY:5}
fitops.security.rate-limit.refill-period=${RATE_LIMIT_REFILL_PERIOD:PT1M}