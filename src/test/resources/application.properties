spring.application.name=fitops-test
# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitops}
spring.datasource.username=${DB_USERNAME:fitops}
spring.datasource.password=${DB_PASSWORD}
# log
logging.structured.format.console=logstash
# JWT (test-only fixed secret — must be ≥32 chars)
fitops.security.jwt.issuer=fitops
fitops.security.jwt.secret=test-secret-do-not-use-in-prod-pls-32+
fitops.security.jwt.access-token-ttl=PT15M
# CORS
fitops.security.cors.allowed-origins=http://localhost:5173
fitops.security.cors.max-age=PT1H