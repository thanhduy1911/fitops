services:

  postgres:
    image: postgres:18-alpine
    container_name: fitops-postgres
    restart: unless-stopped
    ports:
      - "5432:5432" # host:container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # data survives docker-compose down
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitops-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80" #http://localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Redis — Phase 2 (uncomment to activate)
  # ─────────────────────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: fitops-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

# ─────────────────────────────────────────────
# Named volumes — data persists across restarts
# Use `docker-compose down -v` to wipe all data
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  pgadmin_data:
  # redis_data:
