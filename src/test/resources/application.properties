spring.application.name=fitops-test
# database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitops}
spring.datasource.username=${DB_USERNAME:fitops}
spring.datasource.password=${DB_PASSWORD}
# log
logging.structured.format.console=logstash
# JWT (test-only fixed secret — must be ≥32 chars)
fitops.security.jwt.secret=test-secret-do-not-use-in-prod-pls-32+
fitops.security.jwt.issuer=fitops
fitops.security.jwt.access-token-ttl=PT1H
# CORS
fitops.security.cors.allowed-origins=http://localhost:5173
fitops.security.cors.max-age=PT1H
# Spring Monolith
spring.jpa.hibernate.ddl-auto=update
# Cache
fitops.cache.default-ttl=10m
fitops.cache.default-max-size=500
# Password hashing
fitops.security.password.bcrypt-strength=12
# Refresh token
fitops.security.refresh-token.ttl=P7D
fitops.security.refresh-token.cookie-name=refreshToken
fitops.security.refresh-token.cookie-path=/api/v1/auth
fitops.security.refresh-token.secure=true
# Password reset
fitops.security.password-reset.ttl=PT1H
fitops.security.password-reset.reset-url-base=http://localhost:5173/reset-password